dnsServer:
  port: 53
  max-concurrent-connections: 100
  verbose: false
  running: true
  custom-resolve: {}
  custom-resolve-timeout: 3

doh:
  servers:
    - "https://dns.google/dns-query"
    - "https://cloudflare-dns.com/dns-query"
  resolvers:
    - "1.1.1.1"
    - "8.8.8.8"
  cache-ttl: 300

grpc:
  tcp:
    enabled: true
    address: ":50051"
    auth: true

  unix:
    enabled: true
    path: "/tmp/vpner.sock"

  auth:
    password: "secret123"

unblock-rules-path: "/opt/etc/vpner/vpner_unblock.yaml"

network:
  lan-interfaces:
    - "br0"
  enable-ipv6: false
  enable-tproxy: false
  ipset-debug: false
  ipset-stale-queries: 100
  # Kernel timeout (seconds) for DNS-resolved ipset entries. Every DNS answer
  # refreshes the timer, so IPs in active use never expire while rotated-out
  # ones age out automatically. 0 = default (3600), minimum 60,
  # -1 = legacy mode (reactive deletion driven by ipset-stale-queries).
  ipset-entry-timeout: 3600
