name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  packages:
    name: package ${{ matrix.pkgarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: arm64, pkgarch: aarch64-3.10 }
          - { goarch: arm64, pkgarch: aarch64-3.10_kn }
          - { goarch: mipsle, pkgarch: mipsel-3.4 }
          - { goarch: mips, pkgarch: mips-3.4 }
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build opkg package
        run: ARCH_LIST="${{ matrix.goarch }}:${{ matrix.pkgarch }}" GOOS=linux ./make.sh

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp build/*.ipk out/
          GOOS=linux GOARCH=${{ matrix.goarch }} go build -ldflags="-s -w" \
            -o "out/vpnerhookcli-${{ matrix.pkgarch }}" ./cmd/vpnerhookcli

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.pkgarch }}
          path: out/
          if-no-files-found: error

  cli:
    name: cli ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build vpnerctl
        run: |
          mkdir -p out
          bin="out/vpnerctl-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            bin="${bin}.exe"
          fi
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -ldflags="-s -w" -o "$bin" ./cmd/vpnerctl

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: out/
          if-no-files-found: error

  release:
    name: collect and publish
    needs: [packages, cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: find dist -type f | sort

      - name: Upload combined artifact
        uses: actions/upload-artifact@v7
        with:
          name: vpner-build
          path: dist/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.ipk
            dist/vpnerctl-*
            dist/vpnerhookcli-*
